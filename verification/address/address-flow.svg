<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 760" role="img" aria-labelledby="title desc">
<title id="title">Address Flow</title>
<desc id="desc">Flow diagram matching the Mermaid source in the adjacent architecture document.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#176B64" stroke-width="1.5"/></marker></defs>
<rect width="1010" height="760" fill="#F7F8F8"/>
<path d="M350 82 L350 110" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480 136 L525.0 136 L525.0 136 L570 136" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530.0" y="128" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Later</text>
<path d="M700 110 L700 78 L350 78 L350 110" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="72" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">When needed</text>
<path d="M350 162 L350 190" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="363" y="180.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Yes</text>
<path d="M350 242 L350 270" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 322 L350 350" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 402 L350 430" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="363" y="420.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Approved</text>
<path d="M480 376 L525.0 376 L525.0 376 L570 376" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530.0" y="368" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Inconclusive or rejected</text>
<path d="M350 482 L350 510" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 562 L350 590" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 642 L350 670" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="363" y="660.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Yes</text>
<path d="M220 616 L90 616 L90 216 L220 216" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="97" y="416.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">No</text>
<rect x="220" y="30" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="57.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Suggest address check</text>
<rect x="220" y="110" width="260" height="52" rx="12" fill="#E7F1EF" stroke="#176B64" stroke-width="1.5"/>
<text x="350" y="137.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20282B">Continue now?</text>
<rect x="220" y="190" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="217.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Claim address and upload proof</text>
<rect x="220" y="270" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="297.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">AI auto report</text>
<rect x="220" y="350" width="260" height="52" rx="12" fill="#E7F1EF" stroke="#176B64" stroke-width="1.5"/>
<text x="350" y="377.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20282B">Screening outcome</text>
<rect x="220" y="430" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="457.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Third-party check</text>
<rect x="220" y="510" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="537.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Record decision and expiry</text>
<rect x="220" y="590" width="260" height="52" rx="12" fill="#E7F1EF" stroke="#176B64" stroke-width="1.5"/>
<text x="350" y="617.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20282B">Current and same address?</text>
<rect x="220" y="670" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="697.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Feature gate may allow</text>
<rect x="570" y="110" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="700" y="137.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Use eligible features</text>
<rect x="570" y="350" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="700" y="377.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Recapture or review</text>
</svg>
