name: Complete central documentation synchronization (temporary)
on:
  push:
    branches: [docs/sync-implementation-20261115]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply replay-tested documentation delta
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          source = pathlib.Path('.github/audit-transfer/complete.b64').read_text().strip()
          script = lzma.decompress(base64.b64decode(source, validate=True))
          assert hashlib.sha256(script).hexdigest() == '09e93cad860b4b39562e1c22be9e96d34815645f523a76440560018629b5fc82', 'Transfer checksum mismatch'
          path = pathlib.Path('/tmp/apply-design-sync.py')
          path.write_bytes(script)
          subprocess.run(['python', str(path)], check=True)
          PY
      - name: Run the complete documentation validation
        run: |
          python -m pip install -r sites/requirements.txt
          python sites/test_build.py
          python sites/test_current_contracts.py
          python sites/catalog.py --check
          python sites/build.py
          git diff --check
          test ! -d .github/audit-transfer
          test ! -e .github/workflows/export-audit-sources-temporary.yml
          test ! -e .github/workflows/complete-design-sync-temporary.yml
      - name: Commit only verified final source and remove audit scaffolding
        run: |
          git add -A
          if git diff --cached --name-only | grep -E '^(sites/dist/|\.github/audit-transfer/)' | while read -r file; do test -e "$file" && exit 1; done; then :; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize central contracts with merged auth flows and current component ownership'
          git push origin HEAD:docs/sync-implementation-20261115
