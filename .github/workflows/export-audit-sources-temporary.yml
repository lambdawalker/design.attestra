name: Export documentation audit sources (temporary)
on:
  push:
    branches: [docs/sync-implementation-20261115]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Snapshot tracked source and public implementation evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/audit/wheels
          git archive --format=tar.gz --output=/tmp/audit/design.attestra.tar.gz HEAD
          python -m pip download -r sites/requirements.txt -d /tmp/audit/wheels
          python - <<'PY'
          import datetime, io, json, os, pathlib, subprocess, tarfile, urllib.request
          root = pathlib.Path('/tmp/audit')
          repos = ['android.apexfission.auth', 'go.apexfission.aws.auth', 'go.apexfission.aws.verifyemail', 'go.appexfission.aws.card-capture', 'go.attestra.aws', 'go.infra.composer', 'android.ui.common', 'android.apexfission.permissions', 'android.apexfission.carddetector']
          report = {'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'design_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'repositories': {}, 'pull_requests': {}}
          def api(path):
              req = urllib.request.Request('https://api.github.com/repos/lambdawalker/' + path, headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'attestra-docs-audit'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          for name in repos:
              checkout = pathlib.Path('/tmp/sources') / name
              subprocess.run(['git', 'clone', '--depth=1', 'https://github.com/lambdawalker/' + name + '.git', str(checkout)], check=True)
              sha = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True).strip()
              report['repositories'][name] = {'sha': sha, 'branch': subprocess.check_output(['git', '-C', str(checkout), 'branch', '--show-current'], text=True).strip()}
              with tarfile.open(root / (name + '.tar.gz'), 'w:gz') as archive:
                  for path in subprocess.check_output(['git', '-C', str(checkout), 'ls-files'], text=True).splitlines():
                      source = checkout / path
                      if source.is_file() and source.suffix in ('.md', '.go', '.kt', '.kts', '.toml', '.json', '.yaml', '.yml', '.xml', '.py', '.sh', '.bat', '.txt', '.mod', '.sum'):
                          archive.add(source, arcname=path)
          for name, numbers in {'design.attestra': [11, 14, 15], 'android.apexfission.auth': [78, 79, 80, 81], 'go.apexfission.aws.verifyemail': [6, 7], 'go.attestra.aws': [31]}.items():
              for number in numbers:
                  pr = api(f'{name}/pulls/{number}')
                  report['pull_requests'][f'{name}#{number}'] = {key: pr.get(key) for key in ['number', 'title', 'state', 'merged', 'merged_at', 'mergeable', 'draft', 'html_url']}
                  report['pull_requests'][f'{name}#{number}'].update(head=pr['head']['sha'], base=pr['base']['sha'])
                  if name == 'design.attestra' and number in (11, 14):
                      (root / f'design-pr-{number}-files.json').write_text(json.dumps(api(f'{name}/pulls/{number}/files?per_page=100'), indent=2))
          (root / 'evidence.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Baseline documentation checks
        run: |
          python -m pip install -r sites/requirements.txt
          python sites/test_build.py
          python sites/build.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: attestra-docs-audit-sources
          path: /tmp/audit/
          retention-days: 3
