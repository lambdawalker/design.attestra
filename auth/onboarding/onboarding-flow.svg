<text x="363" y="580.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Yes</text>
<path d="M480 536 L525.0 536 L525.0 536 L570 536" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530.0" y="528" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Expired</text>
