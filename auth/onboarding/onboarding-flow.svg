<rect x="220" y="30" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="57.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Enter email</text>
<rect x="220" y="110" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="137.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">POST /signup</text>
<rect x="220" y="190" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="217.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">SES email with app-domain link</text>
<rect x="220" y="270" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="297.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Open confirmation screen</text>
<rect x="220" y="350" width="260" height="52" rx="12" fill="#E7F1EF" stroke="#176B64" stroke-width="1.5"/>
