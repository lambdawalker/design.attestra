<script>
  // Micro-interaction toggling passkey state to satisfy specification test cases:
  // "If passkey was skipped, show Passkey not added and re-entry link"
  let isPasskeyAdded = true;
  const toggleBtn = document.getElementById('toggle-state-btn');
  const passkeyTitle = document.getElementById('passkey-title');
  const passkeyDesc = document.getElementById('passkey-desc');
  const passkeyBadge = document.getElementById('passkey-badge');
  const passkeyIcon = document.getElementById('passkey-icon');
  const passkeyIconBox = document.getElementById('passkey-icon-box');

  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      isPasskeyAdded = !isPasskeyAdded;
      if (isPasskeyAdded) {
        passkeyTitle.textContent = 'Passkey added';
        passkeyDesc.textContent = 'Passkey added to your account';
        passkeyIcon.textContent = 'passkey';
        passkeyIconBox.className = 'w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0 text-primary';
        passkeyBadge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded bg-secondary/10 text-secondary';
        passkeyBadge.innerHTML = '<span class="material-symbols-outlined text-[14px]">shield_check</span><span class="font-label-md text-label-md font-semibold tracking-wide">Active</span>';
      } else {
        passkeyTitle.textContent = 'Passkey not added';
        passkeyDesc.innerHTML = '<a href="#" class="text-primary hover:underline font-medium inline-flex items-center gap-1">Add passkey now &rarr;</a>';
        passkeyIcon.textContent = 'key_off';
        passkeyIconBox.className = 'w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0 text-outline';
        passkeyBadge.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded bg-surface-container-highest text-outline';
        passkeyBadge.innerHTML = '<span class="font-label-md text-label-md font-medium tracking-wide">Skipped</span>';
      }
    });
  }
</script></main>
