<text x="700" y="457.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">POST /auth/email/start</text>
<rect x="570" y="510" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="700" y="537.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Enter email code</text>
<rect x="570" y="590" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="700" y="617.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">POST /auth/email/complete</text>
</svg>
