<rect x="220" y="350" width="260" height="52" rx="12" fill="#E7F1EF" stroke="#176B64" stroke-width="1.5"/>
<text x="350" y="377.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20282B">Credential completed?</text>
<rect x="220" y="430" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="457.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">POST /auth/passkey/complete</text>
<rect x="220" y="510" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="537.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Authenticated session</text>
