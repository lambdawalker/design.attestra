<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Login Flow</title>
<desc id="desc">Flow diagram matching the Mermaid source in the adjacent architecture document.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#176B64" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="680" fill="#F7F8F8"/>
<path d="M350 82 L350 110" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 162 L350 190" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 242 L350 270" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="363" y="260.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Yes</text>
<path d="M480 216 L525.0 216 L525.0 376 L570 376" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530.0" y="290.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">No</text>
<path d="M350 322 L350 350" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 402 L350 430" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="363" y="420.0" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Yes</text>
<path d="M480 376 L525.0 376 L525.0 376 L570 376" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530.0" y="368" font-family="Arial,sans-serif" font-size="12" fill="#4E5B60">Cancel or fail</text>
<path d="M350 482 L350 510" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 402 L700 430" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 482 L700 510" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 562 L700 590" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570 616 L90 616 L90 536 L220 536" fill="none" stroke="#176B64" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="30" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="57.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">Enter email</text>
<rect x="220" y="110" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
<text x="350" y="137.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20282B">POST /auth/passkey/start</text>
<rect x="220" y="190" width="260" height="52" rx="12" fill="#E7F1EF" stroke="#176B64" stroke-width="1.5"/>
<text x="350" y="217.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20282B">Passkey challenge available?</text>
<rect x="220" y="270" width="260" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2E3" stroke-width="1.5"/>
